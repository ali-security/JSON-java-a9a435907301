# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  # old-school build and jar method. No tests run or compiled.
  build-1_6: 
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # build for java 1.6, however don't run any tests
        java: [ 1.6 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v2
      # Azul's API no longer lists JDK 6, so setup-java@v1 cannot resolve 1.6 by
      # version; fetch the Zulu 6 tarball from Azul's CDN and hand it over as jdkFile.
      - name: Download Zulu JDK ${{ matrix.java }}
        run: curl -fsSL -o "$RUNNER_TEMP/zulu-jdk6.tar.gz" https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
          jdkFile: ${{ runner.temp }}/zulu-jdk6.tar.gz
      - name: Compile Java ${{ matrix.java }}
        run: |
          mkdir -p target/classes
          javac -d target/classes/ src/main/java/org/json/*.java
      - name: Create java ${{ matrix.java }} JAR
        run: |
          jar cvf target/org.json.jar -C target/classes .
      - name: Upload Java ${{ matrix.java }} JAR
        uses: actions/upload-artifact@v4
        with:
          name: Java ${{ matrix.java }} JAR
          path: target/org.json.jar
      
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        # build against supported Java LTS versions:
        java: [ 8, 11 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v2
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
      - name: Compile Java ${{ matrix.java }}
        run: mvn clean compile -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} -Dmaven.test.skip=true -Dmaven.site.skip=true -Dmaven.javadoc.skip=true
      - name: Run Tests ${{ matrix.java }}
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn test -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} -Dtest="${{ inputs.test-filter }}" -DfailIfNoTests=false
          else
            mvn test -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
          fi
      # The release jar (Build-Jdk 1.8, maven-bundle-plugin manifest) is packaged on
      # the Java 8 leg; the suite already ran in the step above.
      - name: Package release JAR ${{ matrix.java }}
        if: ${{ matrix.java == 8 }}
        run: |
          mvn package -DskipTests -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
      - name: Upload release JAR ${{ matrix.java }}
        if: ${{ matrix.java == 8 }}
        uses: actions/upload-artifact@v4
        with:
          name: Release JAR ${{ matrix.java }}
          path: target/json-*[0-9].jar
          if-no-files-found: error
      - name: Build Test Report ${{ matrix.java }}
        if: ${{ always() }}
        run: |
          mvn surefire-report:report-only -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
          mvn site -DgenerateReports=false -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
      - name: Upload Test Results ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Results ${{ matrix.java }}
          path: target/surefire-reports/
      - name: Upload Test Report ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Report ${{ matrix.java }}
          path: target/site/
